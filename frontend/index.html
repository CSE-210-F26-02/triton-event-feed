<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Community Map — UCSD events</title>
    <meta
      name="description"
      content="What's happening on campus right now: events from UCSD students and orgs."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- API origin/prefix; empty = same origin ("/api/..."). -->
    <meta name="cm-api-base" content="" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to events</a>

    <header class="site-header">
      <h1 class="site-title">
        <img
          class="site-title__icon"
          src="./assets/triton.jpg"
          alt=""
          width="76"
          height="76"
        />
        <span class="site-title__text">Community Map</span>
      </h1>
      <div id="account" class="account" aria-label="Account"></div>
    </header>

    <main id="main" tabindex="-1">
      <section
        id="filters"
        class="filters"
        role="search"
        aria-label="Filter events"
      ></section>

      <div class="events-layout">
        <section
          id="panel-list"
          class="events-sidebar"
          aria-labelledby="events-heading"
        >
          <div class="events-sidebar__header">
            <h2 id="events-heading" class="events-sidebar__title">Events</h2>
            <div id="event-date-filter"></div>
          </div>
          <div id="list" class="list" aria-live="polite" aria-busy="true">
            <p class="loading">Loading events…</p>
          </div>
        </section>
        <section id="panel-map" class="events-map" aria-label="Map">
          <div id="map"></div>
        </section>
      </div>
    </main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript
      ><p class="notice">
        Community Map needs JavaScript to load events.
      </p></noscript
    >
  </body>
</html>
