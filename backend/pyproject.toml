[project]
name = "triton-event-feed-backend"
version = "0.1.0"
description = "Backend for the Triton Event Feed application."
readme = "README.md"
# ci.yml, backend.yml and the Dockerfile all run Python 3.12.
requires-python = ">=3.12"
dependencies = [
  "dotenv>=0.9.9",
  "fastapi==0.163.1",
  "httpx==0.28.1",
  "icalendar==7.3.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "regex>=2026.11.25",
  "uvicorn[standard]==0.54.0",
  "websockets==17.4",
]

# Dev tools for `uv sync`. CI installs them from requirements-dev.lock, which is
# exported from uv.lock (see the comment in .github/workflows/ci.yml).
[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[tool.pytest.ini_options]
# Code imports the backend as a package ("from backend.lexicon import ..."),
# like main.py does, so the repo root (the folder above backend/) must be
# importable when pytest runs from inside backend/.
pythonpath = [".."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
# Match flake8's 79-character limit (backend/.flake8; CI runs both). With the
# same limit, black wraps long lines in parentheses itself, so names never have
# to be shortened to fit.
line-length = 79
target-version = ["py312"]

[tool.ruff]
# Same 79-character limit as black and flake8 so all three agree.
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "lexicon*"]
