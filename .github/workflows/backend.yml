name: Backend Linting and Formatting Checks

# Runs on every push (any branch) and every pull request, so a unformatted change or
# a linting error shows a red check before it reaches main.
on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.12'
            - name: Install dependencies
              run: pip install -r requirements.txt
              working-directory: ./backend
            - name: Install flake8 and black
              run: pip install flake8 black
              working-directory: ./backend
            - name: Run style linter checks
              run: flake8 .
              working-directory: ./backend
            - name: Run prettier checks
              run: black --check .
              working-directory: ./backend
            - name: Install pytest
              run: pip install --only-binary :all: pytest==9.2.0 pytest-asyncio==1.4.1.post1
              working-directory: ./backend
            # pytest reads its settings from pyproject.toml, which adds the repo
            # root to the import path so "from backend.lexicon import ..." works.
            - name: Run unit tests
              run: pytest
              working-directory: ./backend
